name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test | ${{ matrix.feature }} / ${{ matrix.toolchain }}
    runs-on: codeberg-medium
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
        feature:
          - default
          #- gui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

          key: ${{ matrix.toolchain }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt update && sudo apt install libgtk-4-dev libadwaita-1-dev -y
        if: matrix.feature == 'gui'

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: ${{ matrix.toolchain }}

      - name: Check
        run: cargo fmt --check --verbose

      - name: Build
        run: cargo build --features ${{ matrix.feature }} --verbose

      - name: Test
        run: cargo test --features ${{ matrix.feature }} --verbose

  clippy:
    name: Lint | ${{ matrix.feature }}
    if: forgejo.ref_type != 'tag'
    runs-on: codeberg-medium
    strategy:
      matrix:
        feature:
          - default
          #- gui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

          key: clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt update && sudo apt install libgtk-4-dev libadwaita-1-dev -y
        if: matrix.feature == 'gui'

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          components: clippy
          toolchain: stable

      - name: Validate
        run: cargo clippy --features ${{ matrix.feature }} -- -D clippy::all -D warnings

  codecov:
    needs: test
    name: Coverage | ${{ matrix.feature }}
    if: forgejo.ref_type != 'tag'
    runs-on: codeberg-medium
    strategy:
      matrix:
        feature:
          - default
          #- gui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

          key: ${{ runner.os }}-codecov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: sudo apt update && sudo apt install libgtk-4-dev libadwaita-1-dev -y
        if: matrix.feature == 'gui'

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Install LLVM
        uses: https://github.com/taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --workspace --features ${{ matrix.feature }} --lcov --output-path lcov.info

      - name: Install codecov
        run: curl -Os https://cli.codecov.io/latest/linux/codecov && sudo chmod +x codecov

      - name: Upload coverage
        run: ./codecov upload-process --git-service github --disable-search -t ${{ secrets.CODECOV_TOKEN }} -n ${{ forgejo.run_id }} -F ${{ matrix.feature }} -f lcov.info

  crate:
    name: Publish crate
    needs: test
    runs-on: codeberg-medium
    if: >-
      forgejo.ref_type == 'tag' &&
      forgejo.repository_owner == 'charlesrocket'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}

  release:
    name: Create release
    needs: crate
    if: >-
      forgejo.ref_type == 'tag' &&
      forgejo.repository_owner == 'charlesrocket'

    uses: charlesrocket/reusable/.forgejo/workflows/release.yml@trunk
    with:
      skip-assets: true
